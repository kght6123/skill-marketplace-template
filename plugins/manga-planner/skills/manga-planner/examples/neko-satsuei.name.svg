<text x="60" y="606" font-size="17" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#666">1 起｜long / eye-level｜塀の上の猫を見つけてスマホを構える</text>
<rect x="48" y="656" width="672" height="432" fill="none" stroke="#000" stroke-width="6"/>
