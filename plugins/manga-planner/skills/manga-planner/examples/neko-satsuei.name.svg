<text x="60" y="1070" font-size="17" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#666">2 承｜full / eye-level｜忍び足で近づく</text>
<rect x="48" y="1120" width="672" height="432" fill="none" stroke="#000" stroke-width="6"/>
